# Vitrine SCR seule : PostgreSQL + backend (MODE=vitrine) + Nginx (build de frontend-public)
# Lancement : cp .env.example .env, puis docker compose up -d (voir DEPLOIEMENT.md)
name: scr-vitrine

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scr_vitrine
      POSTGRES_USER: scr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scr -d scr_vitrine"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Une seule instance : le verrou des tâches FFF est en mémoire (ne pas utiliser --scale)
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      MODE: vitrine
      CRON_ENABLED: "true"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: scr_vitrine
      DB_USER: scr
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADS_DIR: /data/uploads
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build: ../frontend-public
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
