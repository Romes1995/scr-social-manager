# Vitrine SCR : fichiers du build, API et logos relayés au backend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Résolution du nom « backend » à chaque requête (backend recréé : nouvelle IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3001;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Fichiers versionnés par Vite (nom avec empreinte) et visuels optimisés
    location /assets/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /visuels/ { expires 30d; try_files $uri =404; }

    # Application monopage : /tele, /matchs, /classement… servent index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
