# Serveur DOFA simulé pour la CI (deploy/docker-compose.ci.yml) : rejoue les réponses
# enregistrées par backend/scripts/enregistrer-dofa-ci.js (deploy/ci/dofa/).
server {
    listen 80;
    server_name dofa-mock;
    root /usr/share/nginx/html;
    default_type application/json;

    # Matchs SCR paginés : /api/clubs/2131/matchs?page=N → matchs/page-N.json
    location = /api/clubs/2131/matchs {
        try_files /api/clubs/2131/matchs/page-$arg_page.json =404;
    }

    # Classements et fiches clubs : même chemin que DOFA, suffixé .json
    location ~ ^/api/compets/.+/classement_journees$ { try_files $uri.json =404; }
    location ~ ^/api/clubs/\d+$                      { try_files $uri.json =404; }

    location /phlogos/ {
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type image/jpeg;
    }
}
